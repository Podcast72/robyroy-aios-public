name: Public offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Public reference and regression tests
        run: python -B -m unittest discover -s tests -v
      - name: V2 executable mock proofs and CLI examples
        run: python -B -m unittest discover -s public_mock_runtime/proof_tests -v
      - name: Local Markdown links and anchors
        run: python -B scripts/check_markdown_links.py
